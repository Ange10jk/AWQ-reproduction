model:
  name: "NousResearch/Llama-2-7b-hf"
  dtype: "float16"
  device: npu
  load_mode: quantize
  local_files_only: false

calibration:
  dataset: "pileval"
  num_samples: 32
  seq_len: 512
  seed: 42

awq:
  n_bits: 4
  group_size: 128
  symmetric: false
  auto_scale: true
  auto_clip: true
  mixed_precision: fp16
  topk: 8

output:
  dir: "results"
  save_quant_ckpt: true
  quant_ckpt_name: "Llama2_7b_awq_top8_fp16protect"
